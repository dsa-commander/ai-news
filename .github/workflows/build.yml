name: Build AI news page

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch: {}       # lets you click "Run workflow" manually
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: TEMP test gemini generateContent
        run: |
          curl -s -i -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: ${{ secrets.GEMINI_API_KEY }}" \
            -d '{"contents":[{"parts":[{"text":"Say hi in 3 words."}]}]}'

      - name: Run aggregator
        run: python3 aggregate.py --feeds feeds.txt --out docs/index.html --days 4
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated page
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Update AI news page"
          git push
