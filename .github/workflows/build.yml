name: Build AI news page

on:
  schedule:
    # Hourly, 7am-11pm Berlin time. Fixed UTC 5:00-21:00 = 7am-11pm CEST
    # (UTC+2, summer). GitHub Actions cron doesn't follow DST, so once
    # Germany switches to CET (UTC+1, late Oct-late Mar) this drifts to
    # 6am-midnight local until CEST resumes in spring.
    - cron: "0 5-21 * * *"
  workflow_dispatch: {}       # lets you click "Run workflow" manually
  push:
    branches: [main]

concurrency:
  group: build-ai-news-page
  cancel-in-progress: false   # queue overlapping runs instead of racing their
                               # final "git push" against each other

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: Run aggregator
        run: python3 aggregate.py --feeds feeds.txt --out docs/index.html --days 4
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated page
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Update AI news page"
          git push
