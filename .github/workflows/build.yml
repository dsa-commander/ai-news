name: Build AI news page

on:
  schedule:
    # Hourly, 9am-8pm Berlin time. Fixed UTC 7:00-18:00 = 9am-8pm CEST
    # (UTC+2, summer). GitHub Actions cron doesn't follow DST, so once
    # Germany switches to CET (UTC+1, late Oct-late Mar) this drifts to
    # 8am-9pm local until CEST resumes in spring.
    - cron: "0 7-18 * * *"
  workflow_dispatch: {}       # lets you click "Run workflow" manually
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: TEMP burn quota and show exact error
        run: |
          for i in $(seq 1 25); do
            curl -s -o /tmp/resp.json -w "call $i: HTTP %{http_code}\n" -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${{ secrets.GEMINI_API_KEY }}" \
              -d '{"contents":[{"parts":[{"text":"Say hi."}]}]}'
            if grep -q '"code": 429' /tmp/resp.json; then
              echo "--- full error body ---"
              cat /tmp/resp.json
              break
            fi
          done

      - name: Run aggregator
        run: python3 aggregate.py --feeds feeds.txt --out docs/index.html --days 4
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated page
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Update AI news page"
          git push
